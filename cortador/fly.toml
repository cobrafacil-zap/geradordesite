# fly.toml app configuration file generated for cortador-videos on 2026-11-24T19:59:59-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cortador-videos'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[[mounts]]
  source = 'dados'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
