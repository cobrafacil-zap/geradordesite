# Configuração do Fly.io para o Cortador de Vídeos.
# Região "gru" = São Paulo (baixa latência no Brasil).
# Um volume persistente guarda os vídeos enviados e os cortes gerados.

app = "cortador-videos"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # mantém ligado (processamento demora)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.concurrency]]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[mounts]
  source = "dados"
  destination = "/data"
