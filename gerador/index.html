<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gerador de Sites — Fábrica de Sites</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">G</div>
      <div class="brand-text">Gerador de Sites<small>Fábrica de Sites</small></div>
    </div>
    <nav class="nav">
      <div class="nav-label">Principal</div>
      <div class="nav-item active" data-page="dashboard"><span class="ico">▦</span>Dashboard</div>
      <div class="nav-item" data-page="clients"><span class="ico">●</span>Clientes</div>
      <div class="nav-item" data-page="models"><span class="ico">▤</span>Modelos</div>
      <div class="nav-item" data-page="projects"><span class="ico">▶</span>Projetos</div>
      <div class="nav-item" data-page="media"><span class="ico">▣</span>Mídia</div>
      <div class="nav-label" style="margin-top:18px">Sistema</div>
      <div class="nav-item" data-page="components"><span class="ico">▣</span>Componentes</div>
      <div class="nav-item" data-page="admin"><span class="ico">⚙</span>Administração</div>
      <div class="nav-item" data-page="settings"><span class="ico">⚒</span>Configurações</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar">V</div>
        <div>
          <div class="user-name">Vendedor</div>
          <div class="user-role">Plano Pro · Vercel</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="page-subtitle" id="pageSubtitle"></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="goPage('models')">Modelos</button>
        <button class="btn btn-primary btn-sm" onclick="startNewProject()">+ Novo Projeto</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- PRESENTATION -->
<div class="presentation hidden" id="presentationMode">
  <div class="presentation-bar">
    <div class="badge">Modo Apresentação</div>
    <span style="color:rgba(255,255,255,.7)" id="presentationClient">Cliente</span>
    <div class="device-toggle">
      <button class="active" data-device="desktop" onclick="setDevice('desktop')">Desktop</button>
      <button data-device="tablet" onclick="setDevice('tablet')">Tablet</button>
      <button data-device="mobile" onclick="setDevice('mobile')">Mobile</button>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" style="color:rgba(255,255,255,.7)" onclick="openExport()">⤓ Exportar</button>
      <button class="btn btn-ghost btn-sm" style="color:rgba(255,255,255,.7)" onclick="exitPresentation()">✕ Sair</button>
    </div>
  </div>
  <div class="presentation-canvas" id="presentationCanvas"></div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-backdrop hidden" id="exportModal">
  <div class="modal export-modal">
    <div class="modal-head">
      <div class="modal-title">Exportar projeto</div>
      <div class="close-x" onclick="closeExport()">✕</div>
    </div>
    <div class="modal-body" id="exportBody"></div>
  </div>
</div>

<!-- GENERIC MODAL -->
<div class="modal-backdrop hidden" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Modal</div>
      <div class="close-x" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading-backdrop hidden" id="loadingOverlay">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="loading-step" id="loadingStep">Iniciando...</div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loadingBar"></div></div>
    <div class="loading-tip" id="loadingTip">Isso pode levar alguns segundos</div>
  </div>
</div>

<div id="toasts"></div>

<script src="engine/templates.js"></script>
<script src="engine/site-generator.js"></script>
<script src="engine/validator.js"></script>
<script src="engine/zip-export.js"></script>
<script src="engine/app.js"></script>
</body>
</html>
